<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>一新堂 現場アプリ</title>
<style>
:root{--bg:#f7f4ec;--card:#fffdf8;--ink:#3b3a34;--sub:#8b877b;--line:#ebe5d6;--head:#fffdf8;--main:#4f9a78;--main2:#e6f2ea;
  --warn:#e39a5b;--stop:#d9685a;--blue:#5b97c9;--r:20px;--sh:0 2px 10px rgba(120,100,60,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:17px;line-height:1.5}
.bar{background:var(--head);color:var(--ink);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.bar h1{font-size:18px;margin:0;flex:1;font-weight:700}
.bar .who{font-size:13px;color:#cfdde3;cursor:pointer;border:1px solid #4d6673;border-radius:99px;padding:4px 12px;white-space:nowrap}
.bar .back{background:var(--main2);border:none;color:var(--main);border-radius:99px;width:36px;height:36px;padding:0;font-size:24px;padding:0 6px 0 0;cursor:pointer;line-height:1}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{font-size:17px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 10px;text-align:center;font-size:17px;font-weight:700;cursor:pointer;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink);box-shadow:var(--sh)}
.ico{width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.ico svg{width:30px;height:30px}
.hello{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;box-shadow:var(--sh)}
.hello .msg{flex:1}.hello .msg b{display:block;font-size:18px}.hello .msg span{font-size:13px;color:var(--sub)}
.bubble{background:var(--main2);border-radius:14px;padding:8px 12px;font-size:14px;margin-top:4px;display:inline-block}
.tile small{font-weight:400;font-size:12px;color:var(--sub)}
.tile.main{background:linear-gradient(135deg,#5fae89,#4f9a78);color:#fff;border-color:transparent;grid-column:1/-1;min-height:150px;font-size:27px;box-shadow:0 8px 22px rgba(79,154,120,.35);flex-direction:row;justify-content:flex-start;padding-left:22px;gap:14px;text-align:left}
.tile.main small{color:#e3f3ea;display:block;font-size:14px}.tile.main .ico{background:rgba(255,255,255,.22);margin:0;width:68px;height:68px}.tile.main .ico svg{width:38px;height:38px}
.tile.wide{grid-column:1/-1;flex-direction:row;justify-content:flex-start;padding-left:22px;gap:14px;text-align:left;min-height:84px;font-size:20px;border:2px solid #f3c99b}
.tile.wide .ico{margin:0}.tile.wide small{display:block;font-size:13px}
.badge{display:inline-block;background:#fff;color:var(--main);font-size:12px;border-radius:99px;padding:1px 9px;margin-top:4px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--main);background:#fff;color:var(--main);border-radius:99px;padding:13px 16px;font-size:17px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;min-width:92px;font-family:inherit}
.btn.fill{background:var(--main);color:#fff}.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.stop{background:var(--stop);border-color:var(--stop);color:#fff}.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.block{display:flex;width:100%;margin-top:10px}.btn.sm{padding:7px 12px;font-size:14px;min-width:0}.btn.big{padding:20px;font-size:21px}
.btn:disabled{opacity:.35}
.btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
label.f{display:block;font-size:14px;color:var(--sub);margin:14px 0 6px;font-weight:600}
input,select,textarea{width:100%;font-size:17px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-family:inherit}
textarea{font-size:15px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips.c2{grid-template-columns:1fr 1fr}.chips.c4{grid-template-columns:repeat(4,1fr)}.chips.c3{grid-template-columns:repeat(3,1fr)}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50px;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:6px 4px;font-size:15px;text-align:center;cursor:pointer;font-weight:600;user-select:none}
.chip small{font-weight:400;font-size:11px;color:var(--sub)}
.chip.on{background:var(--main);color:#fff;border-color:var(--main)}.chip.on small{color:#d4e8e5}
.person{display:flex;align-items:center;gap:10px;background:#f2eee4;border-radius:16px;padding:13px 12px;cursor:pointer;font-size:17px;user-select:none}
.person .box{width:24px;height:24px;border:2px solid #8a9599;border-radius:7px;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.person.on{background:var(--main2)}.person.on .box{background:var(--main);border-color:var(--main)}
.case{border:1.5px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;background:#fff}
.case.on{border-color:var(--main);background:#f6faf9}
.case .cl{font-size:13px;color:var(--sub)}.case .it{font-weight:700;font-size:16px;line-height:1.35;margin:2px 0 8px}
.case .meta{font-size:12px;color:var(--sub);margin-bottom:8px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1.5px solid var(--line);border-radius:99px;padding:8px 12px;font-size:15px;font-weight:600;cursor:pointer;background:#fff;user-select:none}
.pchip small{font-weight:400;color:var(--sub);margin-left:4px}
.pchip.on{background:var(--main);color:#fff;border-color:var(--main)}.pchip.on small{color:#d4e8e5}
.pchip.today{border-color:#9fcdb5;background:#f3faf5}
.pchip.today.on{background:var(--main);border-color:var(--main);color:#fff}
.job .ttl{font-size:18px;font-weight:700;line-height:1.35}.job .st{font-size:14px;color:var(--main);margin-top:4px}.job .st.p{color:var(--warn)}
.timer{font-size:50px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0;font-family:ui-monospace,Menlo,monospace}.timer.tsm{font-size:26px;color:#7a7e88;margin:0}
.note{font-size:13px;color:var(--sub)}
.alert{background:#fbf1e3;border:1px solid #ecd3b0;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.info{background:#e8edf0;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px;color:#3b4a51}
.seg{display:flex;background:#efe9dc;border-radius:99px;padding:3px;margin-bottom:12px;gap:2px}
.seg div{flex:1;text-align:center;padding:9px 4px;border-radius:99px;cursor:pointer;font-size:14px;font-weight:600;color:var(--sub)}
.seg .on{background:#fff;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left}th{color:var(--sub);font-weight:600;font-size:12px}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}.li .t{flex:1}
.x{border:none;background:#f3e3e1;color:var(--stop);border-radius:8px;width:40px;height:36px;font-size:18px;cursor:pointer}
.addrow{display:flex;gap:8px;margin-top:10px}.addrow input{flex:1}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:15px}.kv>div:nth-child(odd){color:var(--sub)}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.big3 div{background:#eef5f8;border-radius:10px;padding:10px;text-align:center}.big3 b{display:block;font-size:22px}.big3 span{font-size:12px;color:var(--sub)}
.clock{text-align:center;background:var(--main2);border-radius:12px;padding:12px}.clock b{font-size:44px;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 2px;min-height:46px}
.cal .h{background:none;border:none;min-height:0;color:var(--sub)}.cal .w{background:var(--main2);border-color:#a9cbc6}.cal b{display:block;font-size:13px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.thumbs figure{margin:0}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.thumbs figcaption{font-size:11px;color:var(--sub);line-height:1.3}
.hidden{display:none!important}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--main);border-radius:22px 22px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.12);z-index:8;padding:12px 14px 16px}
.dock .in{max-width:560px;margin:0 auto}.dock .sel{font-size:14px;margin-bottom:8px}.dock .sel b{font-size:16px}
.lbl{font-size:12px;color:var(--sub);display:block;margin-bottom:3px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px 26px;max-height:92vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1e2a30;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90%}
svg text{font-family:inherit}
.sheetA4{background:#fff;color:#000;padding:16px;border:1px solid #999}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:99;pointer-events:none;animation:cf 2.4s ease-in forwards}@keyframes cf{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
.stack .bx{animation:drop .6s cubic-bezier(.3,1.4,.5,1) backwards}@keyframes drop{from{transform:translateY(-60px);opacity:0}}
.hk-jump{animation:hkj .9s ease-out 1}@keyframes hkj{0%{transform:translateY(0) scale(1)}25%{transform:translateY(-14px) scale(1.08)}45%{transform:translateY(0) scale(.96)}60%{transform:translateY(-6px)}100%{transform:translateY(0)}}
.hkb{background:#fff7e6;border:1px solid #f0d3a6;border-radius:14px;padding:8px 12px;font-size:15px;margin:2px 0 10px}
.news{border:2px solid #e3a86a;background:#fffaf0}.news .new{background:#e0604f;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px}
.tile{position:relative}.ro input,.ro textarea,.ro button,.ro .chip,.ro .x,.ro [data-edit]{pointer-events:none}.ro .addrow,.ro .x,.ro button{display:none}.wip{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;color:#5a4500;padding:2px 8px;border-radius:999px;background:repeating-linear-gradient(-45deg,#ffd84d 0 6px,#ffe98f 6px 12px);border:1px solid #d9b100}
.tile.dim .ico,.tile.dim{opacity:.92}
.qnow{background:var(--main2);border-radius:14px;padding:8px 12px;margin:8px 0;font-size:16px}.qnow b{font-size:20px}
.a4head{display:flex;align-items:center;gap:10px;border-bottom:2px solid #333;padding-bottom:6px;margin-bottom:10px}
.a4icons{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.a4icons div{border:1px solid #999;border-radius:8px;padding:6px 8px;text-align:center;font-size:12px;width:78px}
.a4icons svg{width:44px;height:44px;display:block;margin:0 auto 2px}
.a4w{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.a4w div{border:2px solid #333;border-radius:8px;padding:6px;text-align:center}.a4w span{font-size:11px;display:block}.a4w b{font-size:20px}
@media print{body>*:not(.modal){display:none!important}.modal{position:static!important;background:none!important}.modal .sheet{box-shadow:none!important;max-height:none!important;overflow:visible!important}.noprint{display:none!important}}
.sheetA4 h3{margin:0 0 6px;font-size:20px}.sheetA4 th{white-space:nowrap;width:64px;font-size:12px;background:#f3f3f3}.sheetA4 td{text-align:left}.sheetA4 table td,.sheetA4 table th{border:1px solid #999;padding:6px}
</style>

<body>
<div id="app"></div>
<script>
/* =====================================================================
   一新堂 現場アプリ v2
   - 案件：受注一覧「社長作成」シートを自動で読み込んだ cases.json（読むだけ。受注一覧には書き込まない）
   - 記録：Microsoft Forms（入力済みリンク）→ 社長の OneDrive の Excel に貯まる
   - 写真：Dropbox ファイルリクエスト（分類ごとのフォルダ）
   ===================================================================== */

/* ---------- 組み込み設定（ここを変えて公開すると全端末に反映） ---------- */
const BUILTIN = {
  staff: [],                                   // 例：['山田','佐藤']
  machines: ['断裁機','抜き機','箔押し機','貼り機','レーザー加工機','プロッター','半自動機'],
  forms: '',  // Forms「現場記録」入力済みリンク
  workStart: '08:30', breaks: ['12:00-13:00'],
  preProcs: ['断裁','ハス切','罫線','箔押し','抜き','隅留','レーザー','プロッター','その他'],
  hariParts: ['ミ','フタ','中箱','表紙','内貼り','貼合','底貼り','台紙貼り'],
  hariMethods: ['手加工','クルミ機','ラッパー','自動表紙','ハイエンド加工'],
  profiles: {}, places:['トイレ','休憩室','作業場','事務所','外回り'], defectUrl:'',                                // 名前ごとの勤務時間 {type,start,end,breaks}
  photo: {}, paperLocs:['棚1','棚2','棚3','パレット']
};
const CARTONS = [
  {id:'IS-No.2',size:'80',L:334,W:239,H:140,g:350},{id:'IS-No.3',size:'100',L:360,W:340,H:250,g:650},
  {id:'IS-120',size:'120',L:471,W:317,H:377,g:950},{id:'IS-140A',size:'140',L:475,W:381,H:508,g:1300},
  {id:'IS-140B',size:'140',L:719,W:434,H:211,g:1250},{id:'IS-160A',size:'160',L:639,W:484,H:441,g:1800},
  {id:'IS-160B',size:'160',L:719,W:434,H:411,g:1900},{id:'IS-160C',size:'160',L:507,W:507,H:549,g:2000}
];
const cartons=()=>{const c=cfg('cartons');return c&&c.length?c:CARTONS;};
const OTHER_WORK = ['段取り','清掃・片付け','材料準備','打合せ','サンプル','その他'];
const TOKENS = {QQKIND:'種別',QQRID:'記録ID',QQDATE:'日付',QQNAME:'入力者',QQCASE:'案件',QQPART:'部品・工程',QQWORKERS:'作業者',
  QQNUM:'人数',QQSTART:'開始',QQEND:'終了',QQWORK:'作業分',QQPAUSE:'中断分',QQADJ:'応援・中抜け',QQMH:'人時',QQGOOD:'数量',
  QQBAD:'不足・不良',QQPLAN:'予定',QQMEMO:'メモ'};

/* ---------- 保存 ---------- */
const KEY='isshindo_field_v2';
let S; try{S=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
S=Object.assign({name:'',staff:null,machines:null,forms:null,workStart:null,breaks:null,preProcs:null,paperLocs:null,hariParts:null,hariMethods:null,profiles:null,lastMethod:'',extraCases:[],
  jobs:[],unsent:[],att:{},maint:[],weights:[],photos:[],packs:[]},S||{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});}catch(e){}
if(!S.born){S.born=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const SHARED_KEYS=['paperLocs','staff','machines','preProcs','hariParts','hariMethods','profiles','cartons','forms','photo','places','defectUrl','packSpecs','packOpt','kaizenDone','kaizenGoal'];
let CONF={},confState='loading',ADMIN=null,ART=null,REAL_ADMIN=false;
const has=v=>v!==null&&v!==undefined;
const cfg=k=>{if(SHARED_KEYS.includes(k)){if(ADMIN&&has(S[k]))return S[k];if(has(CONF[k]))return CONF[k];}return has(S[k])?S[k]:BUILTIN[k];};
const dirtyKeys=()=>SHARED_KEYS.filter(k=>has(S[k])&&JSON.stringify(S[k])!==JSON.stringify(has(CONF[k])?CONF[k]:BUILTIN[k]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('この端末に保存できませんでした');}pushLive();}
async function publishConf(pc){if(pc){pc.disabled=true;pc.textContent='反映中…';}else toast('全員に反映しています…');
    const next=Object.assign({},CONF);SHARED_KEYS.forEach(k=>{if(has(S[k]))next[k]=S[k];});const d=new Date();next.updated=`${ymd(d.getTime())} ${hm(d.getTime())}`;
    try{if(!ART)throw {code:'not_granted'};let code='';try{code=localStorage.getItem(CODEKEY)||'';}catch(e){}if(ENCRYPTED&&!code)throw {code:'no_code'};let body=next;if(ENCRYPTED){try{body=await encJ(next,code);if(!body||!body.enc||!body.ct)throw 0;}catch(x){throw {code:'enc_failed'};}}
      await ART.publish({'config.json':{content:JSON.stringify(body,null,1),contentType:'application/json'}});
      CONF=next;SHARED_KEYS.forEach(k=>S[k]=null);save();render();toast('全員に反映しました');return true;}
    catch(e){const c=e&&e.code;if(pc){pc.disabled=false;pc.textContent='全員に反映する';}
      if(c==='conflict'){toast('別の更新があったので読み直します');}
      else sheet(`<div style="text-align:center">${hakosuke(96,'bow')}</div><h2 style="margin:0 0 8px">反映できませんでした</h2><p>${c==='no_code'||c==='enc_failed'?'暗号化できなかったため、安全のため公開を中止しました。アプリを開き直して合言葉を入れ直してから、もう一度押してください。':c==='capability_disabled'?'公開リンクで開いているため、ここからは反映できません。claude.ai から社長のアカウントで開いてください。':c==='not_writer'||c==='not_granted'?'社長のアカウント（claude.ai）で開いたときだけ反映できます。':'通信エラーです。少し待ってからもう一度押してください。'}</p><p class="note">変更はこの端末に残っています。Claudeに「設定を反映して」と送っても反映できます。</p><button class="btn block" onclick="this.closest('.modal').remove()">閉じる</button>`);return false;}}
/* ---- いまの現場（リアルタイム：ログインした端末同士だけ） ---- */
let ROOM=null,PEERS=[],ROOMCONN=false,ROOMERR='';let CANSEND=false;
async function chkSend(){try{const v=await ROOM.canSendToClaudeSession();const ok=['available','available_if_summoned','available_if_opened'].includes(v);if(ok!==CANSEND){CANSEND=ok;if(view==='home')render();}}catch(e){CANSEND=false;}}
function liveState(){const d=ymd(Date.now());const cut=(x,n)=>String(x||'').slice(0,n);
  return {app:'isshindo',dev:cut(S.devName,20),t:Date.now(),born:S.born||0,org:cut(location.origin,60),un:(S.unsent||[]).length,
    jobs:S.jobs.slice(0,8).map(j=>({i:cut(j.item,28),c:cut(j.client,14),p:cut(j.part,24),w:j.workers.slice(0,6).map(x=>cut(x,10)),s:j.startAt,pm:j.pausedMs,ps:j.pauseStart||0,pz:(j.pz||[]).slice(-6),q:cut(j.qty,8)})),
    att:Object.entries(S.att).filter(([n,x])=>x[d]&&x[d].in&&!x[d].out).slice(0,12).map(([n,x])=>({n:cut(n,10),a:x[d].away?1:0}))};}
let liveT=null;function pushLive(){if(!ROOM)return;clearTimeout(liveT);liveT=setTimeout(()=>{ROOM.presence({live:liveState()}).catch(()=>{});},400);}

/* ---------- 案件データ ---------- */
let DATA={cases:[],days:{},load:{},updated:''}, dataState='loading';
let PAPER={items:[],updated:'',date0:''};
let BOARD={posts:[],defects:null,manuals:{},maint:[],updated:''};
/* ---- 合言葉（データの暗号化：公開リンクでも中身を読まれないように） ---- */
const CODEKEY='isshindo_code';let LOCKED=false;
const b64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const normCode=c=>String(c||'').toLowerCase().replace(/[\s\-ー－]/g,'');
async function kdf(code,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(normCode(code)),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function decJ(o,code){const key=await kdf(code,ub64(o.salt));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},key,ub64(o.ct));return JSON.parse(new TextDecoder().decode(pt));}
async function encJ(obj,code){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await kdf(code,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return {enc:1,salt:b64(salt),iv:b64(iv),ct:b64(ct)};}

function markSent(id){const r=S.unsent.find(x=>x.QQRID===id);S.unsent=S.unsent.filter(x=>x.QQRID!==id);

function pruneSent(){const now=Date.now();S.sentLog=(S.sentLog||[]).filter(r=>!r._ok||r._ok>now-7*86400000); // 到着確認できたものだけ7日で片付ける
  const ok=S.sentLog.filter(r=>r._ok);if(ok.length>200){const drop=new Set(ok.slice(0,ok.length-200).map(r=>r.QQRID));S.sentLog=S.sentLog.filter(r=>!drop.has(r.QQRID));}}
function missing(){const t=gotTime();if(!t||!BOARD.got)return [];const got=new Set(BOARD.got);return (S.sentLog||[]).filter(r=>!r._ok&&r._sent<t-10*60000&&!got.has(r.QQRID)&&r.QQKIND!=='テスト');}

function confetti(n){const cs=['#4f9a78','#e3a86a','#d9685a','#5b97c9','#f2c94c','#9b7fd1'];for(let i=0;i<n;i++){const e=document.createElement('span');e.className='confetti';
  e.style.left=Math.random()*100+'vw';e.style.background=cs[i%cs.length];e.style.animationDelay=(Math.random()*0.6)+'s';e.style.borderRadius=(i%3?'2px':'50%');document.body.appendChild(e);setTimeout(()=>e.remove(),3200);}}
function stackSvg(n,goal,onlyFilled){goal=Math.max(1,goal);const rows=[];let left=goal,w=Math.max(1,Math.ceil((Math.sqrt(8*goal+1)-1)/2));while(left>0){const r=Math.min(w,left);rows.push(r);left-=r;w=Math.max(1,w-1);}
  const B=34,G=4,W=rows[0]*(B+G);let out=`<svg class="stack" viewBox="0 0 ${W} ${rows.length*(B*0.8+G)+4}" width="100%" style="max-height:220px;max-width:${rows[0]*52}px;display:block;margin:0 auto">`;let idx=0;
  rows.forEach((r,ri)=>{const y=(rows.length-1-ri)*(B*0.8+G)+2,x0=(W-r*(B+G))/2;for(let c=0;c<r;c++){const x=x0+c*(B+G),on=idx<n;
    out+=on?`<g class="bx" style="animation-delay:${idx*0.09}s"><rect x="${x}" y="${y+B*0.18}" width="${B}" height="${B*0.62}" fill="#fff" stroke="#22314f" stroke-width="1.4"/><rect x="${x-1.5}" y="${y+B*0.06}" width="${B+3}" height="${B*0.2}" fill="#fff" stroke="#22314f" stroke-width="1.4"/><rect x="${x+B*0.44}" y="${y+B*0.06}" width="${B*0.12}" height="${B*0.2}" fill="#d32f2f"/><rect x="${x+B*0.6}" y="${y+B*0.66}" width="${B*0.07}" height="${B*0.07}" fill="#22314f"/><rect x="${x+B*0.69}" y="${y+B*0.66}" width="${B*0.21}" height="${B*0.07}" fill="#d32f2f"/></g>`
      :(onlyFilled?'':`<rect x="${x}" y="${y+B*0.06}" width="${B}" height="${B*0.74}" fill="none" stroke="#cbbf9f" stroke-dasharray="3 3"/>`);idx++;}});
  return out+'</svg>';}

function unionLen(ints,s0,e0){const a=ints.map(([x,y])=>[Math.max(s0,x),Math.min(e0,y)]).filter(([x,y])=>y>x).sort((p,q)=>p[0]-q[0]);
  let t=0,cs=null,ce=null;for(const [x,y] of a){if(cs===null){cs=x;ce=y;}else if(x<=ce){ce=Math.max(ce,y);}else{t+=ce-cs;cs=x;ce=y;}}if(cs!==null)t+=ce-cs;return t;}
function brkInts(s0,e0){const out=[];for(let d=new Date(ymd(s0)+'T00:00:00').getTime();d<=e0;d+=86400000){const ds=ymd(d);
  (cfg('breaks')||[]).forEach(b=>{const [x,y]=String(b).split('-');if(!x||!y)return;const w1=new Date(ds+'T'+x+':00').getTime(),w2=new Date(ds+'T'+y+':00').getTime();if(w2>w1)out.push([w1,w2]);});}return out;}
const pzInts=(j,n)=>(j.pz||[]).concat(j.pauseStart?[[j.pauseStart,n]]:[]);
const extraPause=j=>Math.max(0,(j.pausedMs||0)-(j.pz||[]).reduce((a,p)=>a+Math.max(0,p[1]-p[0]),0)); // 区間の記録がない中断（あとから入力など）＝休憩以外の中断
const paused=(j,n)=>unionLen(pzInts(j,n),j.startAt,n)+extraPause(j);
const brk=(j,n)=>unionLen(brkInts(j.startAt,n).concat(pzInts(j,n)),j.startAt,n)-unionLen(pzInts(j,n),j.startAt,n); // 休憩として除いた分（中断と重なる分は除く）
const work=(j,n)=>n<=j.startAt?0:Math.max(0,(n-j.startAt)-unionLen(brkInts(j.startAt,n).concat(pzInts(j,n)),j.startAt,n)-extraPause(j));

    QQADJ:(a.aways||[]).map(x=>`${hm(x[0])}-${hm(x[1]||a.out)}`).join('・'),QQPART:`${prof(P).type} ${prof(P).start}-${prof(P).end}`,
    QQMEMO:[a.early?'始業前から勤務':'',a.note||'',a.out>pe+60000?'所定外 '+Math.round((a.out-pe)/60000)+'分':''].filter(Boolean).join('・')});}
function prof(n){const base={type:'正社員',start:'08:30',end:'17:30',breaks:['12:00-13:00']};return Object.assign(base,(cfg('profiles')||{})[n]||{});}
function attDay(name,d){S.att[name]=S.att[name]||{};return S.att[name][d];}
function attCalc(a,P){ // 勤務分（その人の始業・休憩で計算）
  if(!a||!a.in) return 0; const end=a.out||Date.now(); const pf=prof(P||a.who||''); const ws=pf.start;
  let st=a.in; const day=ymd(a.in); const sched=new Date(day+'T'+ws+':00').getTime();
  if(!a.early&&st<sched) st=sched;
  let mins=Math.max(0,(end-st)/60000);
  // 中抜け
  const aways=(a.aways||[]).map(x=>[x[0],x[1]||end]);
  // 定時休憩（中抜けと重なる分は二重に引かない）
  const brs=pf.breaks.map(b=>b.split('-')).filter(b=>b.length===2).map(([s,e])=>[new Date(day+'T'+s+':00').getTime(),new Date(day+'T'+e+':00').getTime()]);
  const segs=aways.concat(brs).map(([s,e])=>[Math.max(s,st),Math.min(e,end)]).filter(([s,e])=>e>s).sort((x,y)=>x[0]-y[0]);
  let off=0,cs=null,ce=null;segs.forEach(([s,e])=>{if(cs===null){cs=s;ce=e;}else if(s<=ce){ce=Math.max(ce,e);}else{off+=ce-cs;cs=s;ce=e;}});if(cs!==null)off+=ce-cs;
  return Math.max(0,mins-off/60000);
}

/* ----- 梱包・重量 ----- */
function packFor(b,ct,mode,meth,g,want){const o=Object.assign({sheet:2,gap:5,maxKg:20},cfg('packOpt')||{});meth=meth||[];
  const ce=Object.assign({},ct);if(meth.includes('緩衝材')){ce.L-=2*o.gap;ce.W-=2*o.gap;ce.H-=2*o.gap;}if(meth.includes('敷紙')){ce.H-=2*o.sheet;}
  const p=packCalc(b,ce,mode);if(!p)return {p:null,ce,o};
  p.per=p.base+p.add;
  if(g>0&&o.maxKg>0){const mx=Math.floor((o.maxKg*1000-ct.g)/g);if(mx<p.total){p.fit=p.total;p.total=Math.max(0,mx);p.capped=true;p.layers=p.total>0?Math.ceil(p.total/p.per):0;p.last=p.total-p.per*(p.layers-1);}}
  p.max=p.total;want=Math.floor(+want||0);
  if(want>0&&want<p.total){p.total=want;p.custom=true;p.layers=Math.ceil(p.total/p.per);p.last=p.total-p.per*(p.layers-1);}
  else if(want>p.total){p.wantOver=want;}

  const rp=$('#pkRep');if(rp)rp.onclick=()=>{if(!f.w||!f.d||!f.h){toast('箱の寸法を入れてください');return;}const c=caseBy(f.key);const ct=cartons().find(x=>x.id===f.ct)||cartons()[0];const p=packFor({w:+f.w,d:+f.d,h:+f.h},ct,f.mode,f.meth,+f.g||0,f.want).p;if(!p||!p.total){toast('梱包できない条件です');return;}

    <div class="note" style="margin-top:8px">始業</div><div class="chips c4">${['08:00','08:30','09:00','09:30','10:00','13:00'].map(x=>`<div class="chip ${pf.start===x?'on':''}" data-ps="${x}">${x}</div>`).join('')}</div>
    <div class="note" style="margin-top:8px">終業</div><div class="chips c4">${['12:00','14:00','15:00','16:00','17:00','17:30'].map(x=>`<div class="chip ${pf.end===x?'on':''}" data-pe="${x}">${x}</div>`).join('')}</div>
    <div class="note" style="margin-top:8px">休憩（自動で引く）</div><div class="chips c2">${['12:00-13:00','12:00-12:45','10:00-10:15','15:00-15:15'].map(x=>`<div class="chip ${pf.breaks.includes(x)?'on':''}" data-pb="${x}">${x}</div>`).join('')}</div></div>`:''}`).join('')||'<p class="note">まだいません。</p>'}
   <div class="addrow"><input id="add_staff" placeholder="追加する名前"><button class="btn fill sm" data-add="staff">追加</button></div>
   <p class="note">名前をタップすると勤務時間を設定できます（正社員 8:30〜17:30／パートは人ごと）。</p></div>`;}
 if(t==='proc')body=lst('preProcs','前加工の作業')+lst('hariParts','貼りの部品')+lst('hariMethods','貼り方')+`<div class="card"><h2>紙の置き場</h2>${cfg('paperLocs').map((n,i)=>`<div class="li"><span class="t">${esc(n)}</span><button class="btn sm" data-plren="${i}">名前を変える</button><button class="x" data-del="paperLocs:${i}">×</button></div>`).join('')}
   <div class="addrow"><input id="add_paperLocs" placeholder="追加する置き場（例：棚4）"><button class="btn fill sm" data-add="paperLocs">追加</button></div>
   <p class="note">名前を変えると、その置き場にある紙もまとめて新しい名前になります（台帳にも反映）。</p></div>`;
 if(t==='mc')body=lst('machines','機械');
 if(t==='ct')body=`<div class="card"><h2>カートン（内寸・重さ）</h2>${cartons().map((c,i)=>`<div class="li"><span class="t"><b>${esc(c.id)}</b> <span class="note">${esc(c.size)}サイズ・${c.L}×${c.W}×${c.H}</span></span>
   <input type="number" inputmode="numeric" data-cg="${i}" value="${c.g}" style="width:84px;padding:8px"><span class="note">g</span><button class="x" data-cdel="${i}">×</button></div>`).join('')}
   <p class="note">重さ（g）を書き換えると、すぐ梱包の計算に使われます。</p></div>
   <div class="card"><h2>カートンを追加</h2>
   <div class="chips c2"><div><span class="lbl">名前</span><input id="cN" placeholder="例：IS-100B"></div><div><span class="lbl">サイズ</span><input id="cS" placeholder="例：100"></div></div>
   <div class="chips" style="margin-top:8px">${['L','W','H'].map((k,i)=>`<div><span class="lbl">内寸 ${['長さ','幅','高さ'][i]}</span><input type="number" inputmode="numeric" id="c${k}"></div>`).join('')}</div>
   <label class="f">重さ（g）</label><input type="number" inputmode="numeric" id="cG">
   <button class="btn fill block" id="cAdd">追加</button><button class="btn sm block" id="cReset" style="margin-top:8px">最初の8種類に戻す</button></div>
   <div class="card"><h2>梱包の計算ルール</h2>${(()=>{const o=Object.assign({sheet:2,gap:5,maxKg:20},cfg('packOpt')||{});return `<div class="chips">
   <div><span class="lbl">敷紙の厚み mm（上下に1枚ずつ）</span><input type="number" inputmode="decimal" id="poS" value="${o.sheet}"></div>
   <div><span class="lbl">緩衝材のすき間 mm（各面）</span><input type="number" inputmode="decimal" id="poG" value="${o.gap}"></div>
   <div><span class="lbl">1箱の重さの上限 kg</span><input type="number" inputmode="decimal" id="poM" value="${o.maxKg}"></div></div>`;})()}
   <button class="btn fill block" id="poSave" style="margin-top:8px">保存</button></div>`;
 if(t==='time_old')body=`<div class="card"><label class="f" style="margin-top:0">始業時刻</label><div class="chips c4">${['08:00','08:30','09:00','09:30'].map(x=>`<div class="chip ${cfg('workStart')===x?'on':''}" data-ws="${x}">${x}</div>`).join('')}</div>
   <label class="f">休憩（自動で引く）</label><div class="chips c2">${['10:00-10:15','12:00-13:00','15:00-15:15','12:00-12:45'].map(x=>`<div class="chip ${cfg('breaks').includes(x)?'on':''}" data-br="${x}">${x}</div>`).join('')}</div></div>`;
 if(t==='send')body=`<div class="card"><h2>Forms 入力済みリンク</h2><textarea id="sForms" rows="4" placeholder="https://forms.office.com/...">${esc(cfg('forms'))}</textarea>
   <p class="note">${cfg('forms')?(fOK?'✓ 種別・記録の2項目を確認できました':'QQKIND と QQBODY が見つかりません。入力済みリンクを作り直してください'):'未設定'}</p><button class="btn fill block" id="sFormsSave">保存</button></div>
   <div class="card"><h2>不良アプリ（AppSheet）のリンク</h2><input id="sDef" value="${esc(cfg('defectUrl')||'')}" placeholder="https://www.appsheet.com/start/..."><p class="note">入れると、ホームの「不良」ボタンがこのアプリを開きます。</p><button class="btn fill block" id="sDefSave">保存</button></div>`;
 if(t==='case')body=`<div class="card"><h2>受注一覧からの読み込み</h2><p class="note" style="margin-top:0">${dataState==='ok'?`${esc(DATA.updated)} 時点・${DATA.cases.length}件。受注一覧は読むだけで、書き換えません。`:'読み込めていません'}</p></div>
   <div class="card"><h2>一覧にない案件を追加（この端末だけ）</h2>${S.extraCases.map((c,i)=>`<div class="li"><span class="t">${esc(c.client)}｜${esc(c.item)}</span><button class="x" data-xc="${i}">×</button></div>`).join('')}
   <input id="xcC" placeholder="得意先" style="margin-top:8px"><input id="xcI" placeholder="品名" style="margin-top:8px"><input id="xcQ" type="number" inputmode="numeric" placeholder="数量" style="margin-top:8px">
   <button class="btn block" id="xcAdd">追加</button></div>`;
 const dk=dirtyKeys();const lock=!ADMIN&&t!=='case';
 const pv=`<button class="btn sm block" id="pvStaff" style="margin-bottom:10px">👀 スタッフの画面で見てみる</button><button class="btn sm block" id="devReset" style="margin-bottom:10px">🧹 この端末のテスト記録を消す</button>`;
 const head=ADMIN?pv+(dk.length?`<div class="card" style="border:2px solid var(--main)"><b>まだこの端末だけの変更があります</b><p class="note" style="margin:4px 0 8px">名前・工程・機械・カートンなどを全員の端末に反映します。</p><button class="btn fill big block" id="pubConf">全員に反映する</button><a href="#" id="dropConf" class="note">変更を取り消す</a></div>`
   :`<p class="note" style="margin:0 0 10px">管理者モード：ここで変えた設定は「全員に反映する」で全端末に配られます。${CONF.updated?'最終反映 '+esc(CONF.updated):''}</p>`)
   :ADMIN===null?`<p class="note">確認中…</p>`:`<div class="card"><b>🔒 設定は管理者（社長）が変更します</b><p class="note" style="margin:4px 0 0">ここでは見るだけです。${CONF.updated?'最終反映 '+esc(CONF.updated):''}</p></div>`;
 return bar('設定','home')+`<div class="wrap">${head}<div class="card" style="padding:12px 14px"><div class="note">この端末の名前（いまの現場に表示）</div><div class="addrow"><input id="devName" value="${esc(S.devName||'')}" placeholder="例：貼りラインiPad"><button class="btn fill sm" id="devSave">保存</button></div></div><div class="seg" style="font-size:13px;white-space:nowrap">${tabs.map(([k,l])=>`<div class="${t===k?'on':''}" data-tab="${k}">${l}</div>`).join('')}</div><div class="${lock?'ro':''}">${body}</div>
  </div>`;};
B.settings=()=>{const after=()=>{save();render();};
  const dr=$('#devReset');if(dr)dr.onclick=()=>confirmSheet('この端末に残っている記録（作業中・未送信・出退勤・メンテ・写真・重量・送信の控え・今月の件数）を消します。設定と合言葉はそのままです。元に戻せません。消しますか？','消す',()=>{
    ['jobs','unsent','sentLog','doneLog','maint','photos','weights','kaizenLog','paperLog'].forEach(k=>S[k]=[]);S.att={};S.cnt={};S.goalSeen='';homeHK='';save();view='home';render();toast('この端末の記録を消しました');});
  const pvb=$('#pvStaff');if(pvb)pvb.onclick=()=>{ADMIN=false;view='home';render();toast('スタッフの画面です。下のボタンで戻れます');};
  const dv=$('#devSave');if(dv)dv.onclick=()=>{S.devName=$('#devName').value.trim();toast('保存しました');after();};
  const dc=$('#dropConf');if(dc)dc.onclick=e=>{e.preventDefault();confirmSheet('この端末の変更を取り消して、全員の設定に戻しますか？','取り消す',()=>{SHARED_KEYS.forEach(k=>S[k]=null);after();});};
  const pc=$('#pubConf');if(pc)pc.onclick=()=>publishConf(pc);
  $$('[data-tab]').forEach(el=>el.onclick=()=>{ui.tab=el.dataset.tab;render();});
  $$('[data-plren]').forEach(el=>el.onclick=()=>{const a=cfg('paperLocs').slice(),i=+el.dataset.plren,old=a[i];
    const m=sheet(`<h2 style="margin:0 0 6px">置き場の名前を変える</h2><p class="note">「${esc(old)}」の新しい名前</p><input id="plN" value="${esc(old)}"><button class="btn fill big block" id="plOk" style="margin-top:10px">変える（全員に反映）</button><button class="btn block" id="plNo">やめる</button>`);
    m.querySelector('#plNo').onclick=()=>m.remove();
    m.querySelector('#plOk').onclick=async()=>{const v=m.querySelector('#plN').value.trim();if(!v||v===old){m.remove();return;}if(a.includes(v)){toast('同じ名前があります');return;}
      a[i]=v;S.paperLocs=a;S.paperLocMap=Object.assign({},S.paperLocMap||{},{[old]:v});save();m.remove();
      const rec=queue({QQKIND:'紙',QQDATE:ymd(Date.now()),QQPART:`${old}｜｜${v}`,QQWORKERS:S.lastWho||'社長',QQGOOD:'0',QQMEMO:'置き場名変更・'+old+'→'+v});
      await publishConf();render();sendSheet(rec,`「${old}」を「${v}」に変えました（台帳にも反映するため送ってね）`);};});
  $$('[data-add]').forEach(el=>el.onclick=()=>{const k=el.dataset.add,v=$('#add_'+k).value.trim();if(!v)return;const a=cfg(k).slice();if(a.includes(v)){toast('すでにあります');return;}a.push(v);S[k]=a;after();});
  $$('[data-del]').forEach(el=>el.onclick=()=>{const [k,i]=el.dataset.del.split(':');const a=cfg(k).slice();confirmSheet(`「${a[i]}」を消しますか？`,'消す',()=>{a.splice(+i,1);S[k]=a;after();});});
  $$('[data-ws]').forEach(el=>el.onclick=()=>{S.workStart=el.dataset.ws;after();});
  $$('[data-edit]').forEach(el=>el.onclick=()=>{ui.edit=ui.edit===el.dataset.edit?'':el.dataset.edit;render();});
  const setP=(fn)=>{const n=ui.edit;const all=Object.assign({},cfg('profiles')||{});const cur=prof(n);fn(cur);all[n]=cur;S.profiles=all;after();};
  $$('[data-pt]').forEach(el=>el.onclick=()=>setP(c=>{c.type=el.dataset.pt;if(c.type==='正社員'){c.start='08:30';c.end='17:30';c.breaks=['12:00-13:00'];}else{c.start='09:00';c.end='16:00';}}));
  $$('[data-ps]').forEach(el=>el.onclick=()=>setP(c=>c.start=el.dataset.ps));
  $$('[data-pe]').forEach(el=>el.onclick=()=>setP(c=>c.end=el.dataset.pe));
  $$('[data-pb]').forEach(el=>el.onclick=()=>setP(c=>{const v=el.dataset.pb;c.breaks=c.breaks.includes(v)?c.breaks.filter(x=>x!==v):c.breaks.concat(v);}));
  $$('[data-br]').forEach(el=>el.onclick=()=>{const v=el.dataset.br,a=cfg('breaks').slice();S.breaks=a.includes(v)?a.filter(x=>x!==v):a.concat(v);after();});
  const cs=()=>cartons().map(c=>Object.assign({},c));
  $$('[data-cg]').forEach(el=>el.onchange=()=>{const a=cs();a[+el.dataset.cg].g=+el.value||0;S.cartons=a;save();toast('保存しました');});
  $$('[data-cdel]').forEach(el=>el.onclick=()=>{const a=cs();if(a.length<2){toast('最低1つは必要です');return;}confirmSheet(`「${a[+el.dataset.cdel].id}」を消しますか？`,'消す',()=>{a.splice(+el.dataset.cdel,1);S.cartons=a;after();});});
  const ca=$('#cAdd');if(ca)ca.onclick=()=>{const v=k=>$('#c'+k).value.trim();const c={id:v('N'),size:v('S'),L:+v('L'),W:+v('W'),H:+v('H'),g:+v('G')||0};
    if(!c.id||!c.L||!c.W||!c.H){toast('名前と内寸3つを入れてください');return;}const a=cs();if(a.some(x=>x.id===c.id)){toast('同じ名前があります');return;}a.push(c);S.cartons=a;after();toast('追加しました');};
  const po=$('#poSave');if(po)po.onclick=()=>{S.packOpt={sheet:+$('#poS').value||0,gap:+$('#poG').value||0,maxKg:+$('#poM').value||0};toast('保存しました');after();};
  const cr=$('#cReset');if(cr)cr.onclick=()=>confirmSheet('カートンを最初の8種類に戻しますか？','戻す',()=>{S.cartons=null;after();});
  const sd=$('#sDefSave');if(sd)sd.onclick=()=>{const v=$('#sDef').value.trim();if(v&&!/^https:\/\//.test(v)){toast('https:// から始まるリンクを入れてください');return;}S.defectUrl=v;toast('保存しました');after();};
  const fs=$('#sFormsSave');if(fs)fs.onclick=()=>{S.forms=$('#sForms').value.trim();toast('保存しました');after();};
  const xa=$('#xcAdd');if(xa)xa.onclick=()=>{const c={client:$('#xcC').value.trim(),item:$('#xcI').value.trim(),qty:$('#xcQ').value.trim()};if(!c.item){toast('品名を入れてください');return;}
    c.key=c.client+'｜'+c.item;S.extraCases.push(c);after();};
  $$('[data-xc]').forEach(el=>el.onclick=()=>{S.extraCases.splice(+el.dataset.xc,1);after();});
};

render();
</script>
</body>
</html>
